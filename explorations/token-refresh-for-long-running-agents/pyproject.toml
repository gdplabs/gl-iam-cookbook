[project]
name = "token-refresh-exploration"
version = "0.0.0"
description = "TokenManager for long-running AI agents - automatic token refresh"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "gl-iam>=0.3.7,<0.4.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
]

[tool.uv.sources]
gl-iam = { index = "gen-ai-internal" }

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://asia-southeast2-python.pkg.dev/gdp-labs/gen-ai-internal/simple/"
explicit = true

# For local development against a gl-sdk checkout, uncomment to override the index:
# gl-iam = { path = "../../../../gl-sdk/libs/gl-iam", editable = true }

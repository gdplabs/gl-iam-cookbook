<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in with Google</title>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem;">
  <h1>Sign in with Google</h1>
  <button id="sign-in" hidden>Sign in with Google</button>
  <button id="sign-out" hidden>Sign out</button>
  <pre id="output">Loading...</pre>

  <script type="module">
    // Load Hexclave's browser SDK (pinned version, no build step needed).
    import { HexclaveClientApp } from "https://esm.sh/@hexclave/js@1.0.137";

    // Create the app
    const hexclave = new HexclaveClientApp({
      ...HEXCLAVE_SETTINGS,
      tokenStore: "cookie",
      urls: { default: { type: "hosted" } },
    });

    // Is signed in?
    const user = await hexclave.getUser();
    const output = document.getElementById("output");

    if (!user) {
      // Signed out: one call sends the user to Google and back to this page.
      const signIn = document.getElementById("sign-in");
      signIn.hidden = false;
      signIn.onclick = () => hexclave.signInWithOAuth("google");
      output.textContent = "Not signed in.";
    } else {
      // Signed in: call the FastAPI backend with the Hexclave access token.
      const token = await user.getAccessToken();
      const response = await fetch("/me", { headers: { Authorization: `Bearer ${token}` } });
      output.textContent = `GET /me -> ${response.status}\n` + JSON.stringify(await response.json(), null, 2);

      const signOut = document.getElementById("sign-out");
      signOut.hidden = false;
      signOut.onclick = () => user.signOut();
    }
  </script>
</body>
</html>

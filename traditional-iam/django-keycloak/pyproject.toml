[project]
name = "django-keycloak"
version = "0.0.0"
description = "GL-IAM Django with Keycloak provider example"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "django>=5.1.0,<6.0.0",
  "djangorestframework>=3.15.0,<4.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "gl-iam[django,keycloak]>=0.3.7,<0.4.0",
]

[tool.uv.sources]
gl-iam = { index = "gen-ai-internal" }

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://asia-southeast2-python.pkg.dev/gdp-labs/gen-ai-internal/simple/"
explicit = true

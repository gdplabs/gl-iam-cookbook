[project]
name = "api-key-hierarchy"
version = "0.0.0"
description = "GL-IAM API Key Hierarchy example demonstrating SOLID patterns"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "asyncpg>=0.29.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "gl-iam[postgresql]>=0.3.7,<0.4.0",
]

[tool.uv.sources]
gl-iam = { index = "gen-ai-internal" }

[[tool.uv.index]]
name = "gen-ai-internal"
url = "https://asia-southeast2-python.pkg.dev/gdp-labs/gen-ai-internal/simple/"
explicit = true

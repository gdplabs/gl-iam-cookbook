[project]
name = "agent-asymmetric-signing"
version = "0.0.0"
description = "Asymmetric (ES256) delegation token signing: an issuer that can mint, and a verifier that cannot"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0,<0.116.0",
  "uvicorn>=0.34.0,<0.35.0",
  "httpx>=0.27.0,<0.29.0",
  "python-dotenv>=1.0.0,<2.0.0",
  # The `asymmetric` extra pulls in `cryptography`. PyJWT implements only the
  # HMAC family on its own, so without it GL-IAM refuses an RS256/ES256
  # SigningConfig at construction rather than failing at the first mint.
  # SigningConfig itself landed in 0.3.15.
  "gl-iam[fastapi,native,asymmetric]>=0.3.15,<0.4.0",
]
